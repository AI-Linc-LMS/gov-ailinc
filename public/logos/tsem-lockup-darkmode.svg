<!-- TSEM lockup, darkmode. Same canvas, mark position and text slots as the
     ai-linc-lockup-*.svg files it replaces, so sidebar and hero sizing is unchanged.
     Gradient: primary-400 #4A7FBB into a lightened sanctioned green #2F9159.
     Not the literal #0E7A3C: on the sidebar ink #0B1B2E that lands at 3.2:1,
     under the 3:1 graphic floor once antialiasing thins the strokes. #2F9159
     clears 4.39:1. components/common/AiLincLoader.tsx mirrors this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="l-darkmode" x1="66" y1="120" x2="334" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A7FBB"></stop>
      <stop offset="1" stop-color="#2F9159"></stop>
    </linearGradient>
  </defs>
  <g transform="translate(194 180)">
    <path d="M 66 210 L 66 162 A 34 34 0 0 1 134 162 L 134 210 Z M 86 210 L 86 162 A 14 14 0 0 1 114 162 L 114 210 Z M 148 210 L 148 114 A 40 40 0 0 1 228 114 L 228 210 Z M 168 210 L 168 114 A 20 20 0 0 1 208 114 L 208 210 Z M 242 210 L 242 62 A 46 46 0 0 1 334 62 L 334 210 Z M 262 210 L 262 62 A 26 26 0 0 1 308 62 L 308 210 Z" fill="url(#l-darkmode)" fill-rule="evenodd"></path>
    <path d="M 66 206 L 334 206 L 334 228 L 66 228 Z" fill="url(#l-darkmode)"></path>
  </g>
  <g transform="translate(620 280)" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="180" letter-spacing="3.6">
    <text fill="#FFFFFF">TSEM</text>
  </g>
  <g transform="translate(622 364)" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="42" letter-spacing="0.42">
    <text fill="rgba(255,255,255,0.78)">Telangana Skills &amp; Employment Mission</text>
  </g>
</svg>
